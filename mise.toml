[tools]
node = "26"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.pnpm-install]
description = "Installs dependencies with pnpm"
run = "pnpm install"
sources = ["package.json", "apps/*/package.json", "packages/*/package.json", "tooling/*/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".pnpmfile.cjs", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.dev]
description = "Calls the dev script in package.json"
run = "pnpm dev"
depends = ["pnpm-install"]
