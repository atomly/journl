name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # Stripe environment variables
  STRIPE_SECRET_KEY: 'sk_test_placeholder_for_build'
  STRIPE_WEBHOOK_SECRET: 'whsec_build_placeholder'

jobs:
  # Full CI runs on stack layers 1, 5, 10, ... and the current top.
  # Intermediate layers defer successfully: native batch merges require all
  # included PRs to satisfy required checks. This is not a concurrency cap.
  # Standalone PRs, main pushes, and merge groups run full CI normally.
  stack-policy:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - name: Select stack CI checkpoints
        id: decision
        uses: actions/github-script@v8
        with:
          script: |
            const stack = context.payload.pull_request?.stack;
            if (stack && (
              !Number.isInteger(stack.position) ||
              !Number.isInteger(stack.size) ||
              stack.position < 1 || stack.position > stack.size
            )) {
              throw new Error('Invalid native stack position or size');
            }
            const run = !stack || stack.position === 1 ||
              stack.position % 5 === 0 || stack.position === stack.size;
            core.setOutput('run', String(run));
            core.notice(!stack ? 'Full CI: standalone PR, push, or merge group.' :
              `Stack layer ${stack.position}/${stack.size}: ${run ? 'run full CI' : 'defer CI to a checkpoint'}.`);

  check:
    needs: stack-policy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI policy decision
        if: >-
          needs.stack-policy.result != 'success' ||
          (needs.stack-policy.outputs.run != 'true' && needs.stack-policy.outputs.run != 'false')
        run: |
          echo "::error::The stack CI policy did not produce a valid decision."
          exit 1

      - name: CI deferred to a stack checkpoint
        if: needs.stack-policy.outputs.run == 'false'
        run: echo "Full CI runs on the bottom PR, every fifth layer, and the top PR."

      - uses: actions/checkout@v7
        if: needs.stack-policy.outputs.run == 'true'

      - name: Setup
        if: needs.stack-policy.outputs.run == 'true'
        uses: ./tooling/github/setup

      - name: Check (lint and format)
        if: needs.stack-policy.outputs.run == 'true'
        run: pnpm check

  typecheck:
    needs: stack-policy
    if: needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  build:
    needs: stack-policy
    if: needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build
        run: pnpm build

      # Reuse the real app build for local browser QA without recompiling it.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: web-preview-build
          include-hidden-files: true
          path: |
            apps/web/.next/
            !apps/web/.next/cache/
            !apps/web/.next/dev/
            !apps/web/.next/workflow-data/
          retention-days: 1

  unit:
    needs: stack-policy
    if: needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./tooling/github/setup
      - name: Unit and UI tests
        run: pnpm test:unit

  integration:
    needs: stack-policy
    if: needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./tooling/github/setup
      - name: Database integration tests
        run: pnpm test:integration

  browser-shards:
    needs: stack-policy
    if: needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Let every leg finish so one failure does not mask the others.
      fail-fast: false
      matrix:
        include:
          # The shell and acceptance specs arrive with the workspace v2 stack;
          # those legs stay empty and pass here until the files exist.
          # Positional args are path regexes; \(app\) escapes the route group.
          - leg: acceptance-1
            run: pnpm --filter @acme/web test:browser 'src/app/\(app\)/_components/shell-acceptance\.browser\.spec\.ts' --shard=1/2 --pass-with-no-tests
          - leg: acceptance-2
            run: pnpm --filter @acme/web test:browser 'src/app/\(app\)/_components/shell-acceptance\.browser\.spec\.ts' --shard=2/2 --pass-with-no-tests
          - leg: shell-1
            run: pnpm --filter @acme/web test:browser 'src/app/\(app\)/_components/' --grep-invert='[a-z]--[a-z]' --shard=1/2 --pass-with-no-tests
          - leg: shell-2
            run: pnpm --filter @acme/web test:browser 'src/app/\(app\)/_components/' --grep-invert='[a-z]--[a-z]' --shard=2/2 --pass-with-no-tests
          - leg: app-1
            run: pnpm --filter @acme/web test:browser 'src/components/' 'src/app/\(app\)/@appSidebar/' 'src/app/\(app\)/explore/' 'src/app/\(app\)/journal/' 'src/testing/' --shard=1/4
          - leg: app-2
            run: pnpm --filter @acme/web test:browser 'src/components/' 'src/app/\(app\)/@appSidebar/' 'src/app/\(app\)/explore/' 'src/app/\(app\)/journal/' 'src/testing/' --shard=2/4
          - leg: app-3
            run: pnpm --filter @acme/web test:browser 'src/components/' 'src/app/\(app\)/@appSidebar/' 'src/app/\(app\)/explore/' 'src/app/\(app\)/journal/' 'src/testing/' --shard=3/4
          - leg: app-4
            run: pnpm --filter @acme/web test:browser 'src/components/' 'src/app/\(app\)/@appSidebar/' 'src/app/\(app\)/explore/' 'src/app/\(app\)/journal/' 'src/testing/' --shard=4/4
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: ./tooling/github/setup
      - name: Sharding covers every browser spec
        run: |
          cd apps/web
          missing=$(find src -name '*.browser.spec.ts' | while read -r f; do
            case "$f" in
              'src/app/(app)/_components/'*|'src/app/(app)/@appSidebar/'*|'src/app/(app)/explore/'*|'src/app/(app)/journal/'*|src/components/*|src/testing/*) ;;
              *) echo "$f" ;;
            esac
          done)
          if [ -n "$missing" ]; then
            echo "::error::Browser specs not covered by CI sharding: $missing"
            exit 1
          fi
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          # An unrelated lockfile bump changes the exact key; restoring a
          # stale prefix lets playwright install fetch only changed engines.
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-playwright-
      - name: Install Playwright browsers
        run: pnpm --filter @acme/web exec playwright install --with-deps chromium webkit
      - name: Browser acceptance
        run: ${{ matrix.run }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results-${{ matrix.leg }}
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/component-review/test-results/
          retention-days: 7

  browser:
    needs: [stack-policy, browser-shards]
    if: always() && needs.stack-policy.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Browser acceptance outcome
        run: |
          echo "Shard matrix result: ${{ needs.browser-shards.result }}"
          test "${{ needs.browser-shards.result }}" = "success"
