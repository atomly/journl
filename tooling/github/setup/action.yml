name: "Setup and install"
description: "Install the mise toolchain and workspace dependencies"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4

    - name: Locate pnpm content store
      id: pnpm-store
      shell: bash
      run: printf 'path=%s\n' "$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

    - shell: bash
      run: pnpm install --frozen-lockfile

    - shell: bash
      run: pnpm check:dependencies
