packages:
- apps/*
- packages/*
- tooling/*
virtualStoreType: ${PNPM_VIRTUAL_STORE_TYPE:-global}
packageExtensions:
  drizzle-kit@0.31.11:
    peerDependencies:
      drizzle-orm: ~0.45.4
  ngraph.leiden@0.3.0:
    dependencies:
      ngraph.graph: 20.1.2
addMissingPeerTypes: true
autoInstallPeers: false
nodeLinker: isolated
linkWorkspacePackages: true
overrides:
  '@tiptap/core': 3.31.4
  '@tiptap/pm': 3.31.4
  '@tiptap/react': 3.31.4
  '@tiptap/extensions': 3.31.4
  '@tiptap/extension-bold': 3.31.4
  '@tiptap/extension-code': 3.31.4
  '@tiptap/extension-italic': 3.31.4
  '@tiptap/extension-strike': 3.31.4
  '@tiptap/extension-underline': 3.31.4
  '@tiptap/extension-link': 3.31.4
  '@tiptap/extension-text': 3.31.4
  '@tiptap/extension-paragraph': 3.31.4
  '@tiptap/extension-horizontal-rule': 3.31.4
  '@tiptap/extension-bubble-menu': 3.31.4
  '@tiptap/extension-floating-menu': 3.31.4
  '@blocknote/server-util>jsdom': 26.1.0
peerDependencyRules:
  allowedVersions:
    zod: ^3.23.8 || ^4.0.0
  ignoreMissing:
  - '@better-auth/agent-auth'
  - '@better-auth/api-key'
  - '@better-auth/passkey'
  - '@instantdb/react'
  - '@marsidev/react-turnstile'
  - '@mikkelscheike/email-provider-links'
  - '@triplit/client'
  - '@triplit/react'
allowBuilds:
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false
