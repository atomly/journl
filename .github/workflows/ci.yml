name: CI

on:
  pull_request:
    branches: ["*"]
    # Re-evaluate eligibility when a PR is retargeted after the bottom merges.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # Stripe environment variables
  STRIPE_SECRET_KEY: 'sk_test_placeholder_for_build'
  STRIPE_WEBHOOK_SECRET: 'whsec_build_placeholder'

jobs:
  # Native GitHub stacks: full CI runs only on the lowest unmerged PR.
  # The required check job blocks every PR above it before checkout or setup.
  # As the bottom merges, the next PR targets the stack base and becomes eligible.
  # Standalone PRs, pushes, and merge groups run normally.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require the lowest unmerged PR in the stack
        if: >-
          github.event.pull_request.stack != null &&
          github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref
        run: |
          echo "::error::Merge the lowest unmerged PR first. Full CI will run here once this PR targets the stack base."
          exit 1

      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check (lint and format)
        run: pnpm check

  typecheck:
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  build:
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build
        run: pnpm build
